name: Собрать Melgram

on:
  # каждый день в 06:17 по Москве проверяем, не вышел ли новый Telegram
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      telegram:
        description: "Какую версию Telegram взять"
        type: choice
        default: "текущая"
        options:
          - "текущая"
          - "последняя"
      accounts:
        description: "Сколько аккаунтов"
        default: "6"
      abis:
        description: "Архитектура процессора"
        type: choice
        default: "arm64-v8a"
        options:
          - "arm64-v8a"
          - "armeabi-v7a"
          - "arm64-v8a,armeabi-v7a"

permissions:
  contents: write

concurrency:
  group: melgram-build
  cancel-in-progress: false

env:
  ACCOUNTS: ${{ inputs.accounts || '6' }}
  ABIS: ${{ inputs.abis || 'arm64-v8a' }}
  CONTACT: miku_gf

jobs:
  plan:
    name: Проверить версию Telegram
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      is_update: ${{ steps.plan.outputs.is_update }}
    steps:
      - uses: actions/checkout@v4

      - name: Что собирать
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.telegram || 'последняя' }}
        run: |
          CUR=$(jq -r '.telegram_commit' update.json)
          BLOCKED=$(jq -r '.blocked.telegram_commit // ""' update.json)
          LATEST=$(git ls-remote https://github.com/DrKLO/Telegram refs/heads/master | cut -f1)
          test -n "$LATEST"
          if [ "$WANT" = "текущая" ]; then TARGET=$CUR; else TARGET=$LATEST; fi
          VERSION=$(curl -fsSL "https://raw.githubusercontent.com/DrKLO/Telegram/$TARGET/gradle.properties" | grep '^APP_VERSION_NAME=' | cut -d= -f2 | tr -d '\r')
          test -n "$VERSION"
          SKIP=false
          if [ "$EVENT" = "schedule" ]; then
            if [ "$TARGET" = "$CUR" ]; then echo "Новых версий Telegram нет"; SKIP=true; fi
            if [ "$TARGET" = "$BLOCKED" ]; then echo "Telegram $VERSION уже отмечен как несовместимый, ждём исправления"; SKIP=true; fi
          fi
          IS_UPDATE=false; [ "$TARGET" != "$CUR" ] && IS_UPDATE=true
          echo "Текущий: $CUR | Последний: $LATEST | Собираем: $TARGET ($VERSION) | обновление: $IS_UPDATE | пропуск: $SKIP"
          { echo "skip=$SKIP"; echo "commit=$TARGET"; echo "version=$VERSION"; echo "is_update=$IS_UPDATE"; } >> "$GITHUB_OUTPUT"

      # GitHub отключает расписание в репозиториях без коммитов 60 дней
      - name: Не дать GitHub уснуть
        if: steps.plan.outputs.skip == 'true'
        run: |
          LAST=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - LAST )) -gt $(( 45 * 86400 )) ]; then
            jq --arg t "$(date -u +%FT%TZ)" '.checked_at = $t' update.json > u.tmp && mv u.tmp update.json
            git config user.name "melgram-bot"; git config user.email "melgram-bot@users.noreply.github.com"
            git commit -qam "Проверка обновлений: без изменений"
            git push -q
          fi

  build:
    name: Сборка
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TELEGRAM_COMMIT: ${{ needs.plan.outputs.commit }}
      TELEGRAM_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Файлы Melgram
        uses: actions/checkout@v4
        with:
          path: kit

      - name: Распаковать melgram.zip (если загружен архивом)
        working-directory: kit
        run: |
          if [ ! -f melgram/patch.py ]; then
            if [ -f melgram.zip ]; then unzip -q -o melgram.zip; else echo "Нет ни папки melgram, ни melgram.zip"; exit 1; fi
          fi
          test -f melgram/patch.py

      - name: Проверить ключи
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Добавь секреты API_ID и API_HASH: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Своя иконка (icon.png / icon.jpg в корне репозитория)
        working-directory: kit
        run: |
          for f in icon.png icon.jpg icon.jpeg icon.webp; do
            if [ -f "$f" ]; then
              pip install --quiet pillow
              python3 melgram/make_icons.py "$f" melgram/res
              echo "Иконка взята из $f"
              break
            fi
          done

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          (sudo fallocate -l 8G /mnt/melgram.swap && sudo chmod 600 /mnt/melgram.swap && sudo mkswap /mnt/melgram.swap && sudo swapon /mnt/melgram.swap) || true
          df -h / ; free -h

      - name: Скачать исходники Telegram ${{ needs.plan.outputs.version }}
        run: |
          git init -q telegram && cd telegram
          git remote add origin https://github.com/DrKLO/Telegram.git
          git fetch -q --depth 1 origin "$TELEGRAM_COMMIT"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8 \
            || git submodule update --init --recursive --jobs 8

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK и NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Кэш компиляции C++
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.ABIS }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.ABIS }}-

      - name: Установить ccache
        run: |
          sudo apt-get install -y -qq ccache > /dev/null
          ccache --set-config=max_size=6G
          ccache --set-config=compiler_check=string:ndk27.2.12479018
          ccache --zero-stats > /dev/null

      - name: Превратить Telegram в Melgram
        id: patch
        env:
          MELGRAM_API_ID: ${{ secrets.API_ID }}
          MELGRAM_API_HASH: ${{ secrets.API_HASH }}
          MELGRAM_ACCOUNTS: ${{ env.ACCOUNTS }}
          MELGRAM_ABIS: ${{ env.ABIS }}
          MELGRAM_BUILD: ${{ github.run_number }}
          MELGRAM_REPO: ${{ github.repository }}
          MELGRAM_CONTACT: ${{ env.CONTACT }}
          MELGRAM_CCACHE: "1"
        run: |
          set -o pipefail
          python3 kit/melgram/patch.py telegram 2>&1 | tee build.log

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка APK
        id: gradle
        working-directory: telegram
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace --continue 2>&1 | tee -a ../build.log

      - name: Статистика кэша
        if: always()
        run: ccache --show-stats || true

      - name: Сохранить кэш компиляции
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.ABIS }}-${{ github.run_id }}

      - name: Подготовить файл
        run: |
          APK=$(find telegram/TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          mkdir -p out && cp "$APK" "out/Melgram-$TELEGRAM_VERSION.apk"
          ls -lh out

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Melgram-${{ env.TELEGRAM_VERSION }}
          path: out/*.apk

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${TELEGRAM_VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --repo "${{ github.repository }}" \
            --title "Melgram ${TELEGRAM_VERSION} (сборка ${{ github.run_number }})" \
            --notes "Основан на Telegram ${TELEGRAM_VERSION}. Аккаунтов: ${ACCOUNTS}. Архитектура: ${ABIS}."
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Сообщить приложениям о новой версии (update.json)
        working-directory: kit
        run: |
          APK_NAME="Melgram-${TELEGRAM_VERSION}.apk"
          git config user.name "melgram-bot"; git config user.email "melgram-bot@users.noreply.github.com"
          git checkout -q -- . 2>/dev/null || true
          git pull -q --rebase origin main
          # при пересборке текущей версии не теряем отметку о несовместимой новой версии
          KEEP_BLOCKED=$(jq -c '.blocked // null' update.json)
          [ "${{ needs.plan.outputs.is_update }}" = "true" ] && KEEP_BLOCKED=null
          jq -n \
            --argjson blocked "$KEEP_BLOCKED" \
            --arg version "$TELEGRAM_VERSION" \
            --argjson build ${{ github.run_number }} \
            --arg commit "$TELEGRAM_COMMIT" \
            --arg apk "https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}" \
            --arg page "https://github.com/${{ github.repository }}/releases/tag/${TAG}" \
            --arg t "$(date -u +%FT%TZ)" \
            '{version: $version, build: $build, telegram_commit: $commit, apk_url: $apk, release_page: $page, built_at: $t, blocked: $blocked}' > update.json
          cat update.json
          git add update.json
          git commit -qm "Melgram ${TELEGRAM_VERSION} (сборка ${{ github.run_number }})"
          git push -q origin HEAD:main

      - name: Обновление невозможно (update.json)
        if: failure() && needs.plan.outputs.is_update == 'true' && (steps.patch.outcome == 'failure' || steps.gradle.outcome == 'failure')
        working-directory: kit
        run: |
          git config user.name "melgram-bot"; git config user.email "melgram-bot@users.noreply.github.com"
          git checkout -q -- . 2>/dev/null || true
          git pull -q --rebase origin main || true
          MSG=$(printf 'Вышла новая версия Telegram %s, но в ней изменилось много функций, и Melgram не может обновиться автоматически.\n\nДля обновления напишите @%s.' "$TELEGRAM_VERSION" "$CONTACT")
          jq --arg v "$TELEGRAM_VERSION" --arg c "$TELEGRAM_COMMIT" --arg m "$MSG" --arg contact "$CONTACT" --arg t "$(date -u +%FT%TZ)" \
            '.blocked = {telegram_version: $v, telegram_commit: $c, message: $m, contact: $contact, since: $t}' update.json > u.tmp && mv u.tmp update.json
          cat update.json
          git commit -qam "Telegram ${TELEGRAM_VERSION}: обновление невозможно, нужна ручная правка"
          git push -q origin HEAD:main

      - name: Лог ошибок (ветка build-logs)
        if: failure()
        run: |
          test -f build.log || exit 0
          grep -n -E "error:|e: file|What went wrong|FAILED|Exception|OutOfMemory|Killed|No space left|\[melgram\] ОШИБКА" build.log \
            | grep -v -E "^[0-9]+:\s*at " | head -n 40 > errors.txt || true
          head -n 12 errors.txt | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          rm -rf logs && git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
          cd logs
          git config user.name "melgram-bot"; git config user.email "melgram-bot@users.noreply.github.com"
          git checkout -q --orphan build-logs
          git rm -rq --cached . || true
          tail -n 5000 ../build.log > build.log
          cp ../errors.txt errors.txt
          git add -f build.log errors.txt
          git commit -qm "Лог сборки ${{ github.run_number }}"
          git push -qf origin build-logs
